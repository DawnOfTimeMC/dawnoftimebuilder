plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

base {
    archivesName = "${mod_name}-fabric-${minecraft_version}"
}

// Include common resources directly in this source set so Loom exposes
// them to the game during dev runs (processResources alone is not enough)
sourceSets.main.resources.srcDir(project(':common').file('src/main/resources'))

processResources {
    // common resources are now in srcDirs AND added via from(commonResources)
    // in multiloader-loader — exclude duplicates so the build doesn't fail
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://cursemaven.com"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "maven.modrinth:fusion-connected-textures:1.1.1-fabric-mc1.20.1"
    modImplementation "curse.maven:jei-238222:6600226"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

publishMods {
    file = remapJar.archiveFile
    modLoaders.addAll("fabric")

    curseforge {
        //fabric only dependencies found on curseforge go here. same format as in the root build.gradle
    }

    modrinth {
        //fabric only dependencies found on modrinth go here. same format as in the root build.gradle
    }
}
