plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
    id 'me.modmuss50.mod-publish-plugin'
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    compileOnly project(":common")

    // Mod compatibility

    modRuntimeOnly("maven.modrinth:rei:IoS2AjPk")
    modRuntimeOnly("maven.modrinth:cloth-config:t8TXrZvZ")
    modRuntimeOnly("maven.modrinth:architectury-api:1MKTLiiG")
    modRuntimeOnly("maven.modrinth:geckolib:LwI6czff")

    modRuntimeOnly("maven.modrinth:lets-do-vinery:YpD6ue8A")
    modRuntimeOnly("maven.modrinth:farmers-delight:NcRp00OO")
    modRuntimeOnly("maven.modrinth:critters-and-companions:acDDSIG3")
    modRuntimeOnly("maven.modrinth:fusion-connected-textures:1.1.1-forge-mc1.20.1")

    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    implementation 'org.jetbrains:annotations:26.0.2'
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    ])
}

publishMods {
    // Point to the pre-built reobfuscated JAR. Build first in IntelliJ (forge > tasks > build > build),
    // then run publishMods. This avoids the reobfJar ordering bug where publishMods uploads a broken JAR.
    file = layout.buildDirectory.file("libs/dawnoftimebuilder-forge-${minecraft_version}-${project.version}.jar")
    modLoaders.add("forge")

    curseforge {
        //forge only dependencies found on curseforge go here. same format as in the root build.gradle
    }

    modrinth {
        //forge only dependencies found on modrinth go here. same format as in the root build.gradle
    }
}